apis:
- name: Oracle REST Data Services Database API — Partitioning
  description: The Oracle REST Data Services (ORDS) Database API. Its Data Dictionary tag exposes Oracle
    Partitioning metadata read-only via GET /database/objects/partitions/ and GET /database/objects/partitions/{table_owner},{table_name},{partition_name},
    projecting DBA_TAB_PARTITIONS / ALL_TAB_PARTITIONS over REST. ORDS is customer-deployed, so the base
    URL is templated on the operator's own host.
