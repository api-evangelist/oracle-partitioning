apis:
- name: Oracle SQL Developer REST Services - Partitioning
  description: >-
    Oracle SQL Developer Web and SQLcl, the SQL surfaces through which partitions are actually created
    and maintained. Partition DDL — CREATE TABLE ... PARTITION BY, ALTER TABLE ... SPLIT/MERGE/EXCHANGE/DROP
    PARTITION — has no REST operation in any Oracle contract and is issued here.
  image: https://www.oracle.com/a/ocom/img/sql-dev.jpg
  baseURL: https://{server}/{context-root}
  humanURL: https://www.oracle.com/database/sqldeveloper/
  properties:
  - type: Documentation
    url: https://docs.oracle.com/en/database/oracle/sql-developer/
  - type: CLI
    url: cli/oracle-partitioning-cli.yml
  - type: Tutorial
    url: https://docs.oracle.com/en/database/oracle/oracle-database/19/vldbg/partition-admin.html
- name: Oracle Cloud Infrastructure Database API - Partitioning
  description: >-
    The Oracle Cloud Infrastructure Database API, which manages the DB systems, Autonomous Databases and
    Exadata infrastructure that host partitioned databases. It manages the database service, not individual
    partitions.
