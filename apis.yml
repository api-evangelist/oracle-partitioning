aid: oracle-partitioning
name: Oracle Partitioning
description: 'Oracle Partitioning is a licensed option of Oracle Database Enterprise Edition that divides
  large tables and indexes into smaller, independently manageable segments called partitions, accessed
  transparently through the table name. It delivers partition pruning (the optimizer eliminates irrelevant
  partitions from query plans), partition-wise parallel operations, and partition maintenance as atomic
  DDL — archiving or purging a partition instead of deleting rows. Strategies include range, interval,
  list, hash, reference, composite and auto-partitioning. It is not a standalone API product: partitions
  are CREATED and MAINTAINED through SQL DDL, and READ over REST through two Data Dictionary endpoints
  of the Oracle REST Data Services (ORDS) Database API, which is the machine-readable contract captured
  in this repository.'
