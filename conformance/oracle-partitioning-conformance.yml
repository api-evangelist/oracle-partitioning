    see: errors/oracle-partitioning-problem-types.yml
  - id: pagination
    name: 'Collection pagination'
    conforms: true
    evidence: 'limit query parameter on 63 operations; response envelope items/hasMore/limit/offset/count/links with LinkRelation {rel, href}.'
    style: 'limit + hasMore + link relations (Oracle ORDS convention, not a published standard)'
  - id: idempotency
    name: 'Idempotency keys'
    conforms: false
    evidence: 'No Idempotency-Key or equivalent parameter or header appears in any of the 352 operations, and ORDS documents no replay-safe retry mechanism.'
  - id: hateoas
    name: 'Hypermedia link relations'
    conforms: true
