domain_standard:
  market: 'Relational database management / very large database management'
  finding: >-
    Oracle Partitioning's own market has no interoperability standard to conform to. Partitioning
    syntax is ISO SQL-adjacent but each vendor's PARTITION BY dialect is its own; there is no
    OpenRTB, FHIR or SCIM equivalent for physical table partitioning, and none was invented to fill
    the slot. The nearest genuine domain standards the CONTRACT declares are SPARQL 1.1 and the
    Open Service Broker API, both on adjacent surfaces rather than on partitioning.
  reward_only_note: 'Recorded as an honest absence for the partitioning surface itself.'
