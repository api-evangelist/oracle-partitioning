  - id: oauth2-protected-resource-metadata
    name: 'OAuth 2.0 Protected Resource Metadata (RFC 9728) — via ORDS MCP'
    conforms: true
    evidence: >-
      The ORDS MCP endpoint answers an unauthenticated request with 401 and a WWW-Authenticate
      challenge pointing at the well-known metadata endpoint, which the client uses to discover the
      authorization server. mcp.security.jwt.profile.authorization.server.url configures what that
      metadata advertises.
    source: https://docs.oracle.com/en/database/oracle/oracle-rest-data-services/26.2/ordig/configuring-model-context-protocol-mcp.html
  - id: jwt
    name: 'JSON Web Token (RFC 7519) + JWKS (RFC 7517)'
    conforms: true
    evidence: 'components.securitySchemes.BearerAuth (http/bearer); ORDS validates MCP bearer tokens against a configured issuer, audience and mcp.security.jwt.profile.jwk.url.'
