note: >-
  Oracle Partitioning is a licensed Oracle Database option, not a product with its own client
  library. There is no partitioning SDK and none was invented. Listed below are the first-party
  Oracle libraries through which partitioning is actually reached: the Oracle Database drivers
  (which execute the partition DDL and read the partitioned tables) and the OCI SDKs (which manage
  the cloud database services those tables live in). Versions and dates are read from each
  registry's metadata endpoint on the date above.
