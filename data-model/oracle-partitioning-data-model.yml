description: >-
  Entity-relationship graph for the partitioning-relevant slice of the Oracle REST Data Services
  Database API. Derived from the Data Dictionary tag of the contract, whose read-only operations
  project the Oracle data dictionary views (DBA_TAB_PARTITIONS / ALL_TAB_PARTITIONS, DBA_TABLES,
  DBA_INDEXES, DBA_TABLESPACES) over REST. All fields below are taken verbatim from the OpenAPI
  component schemas; nothing is inferred.
scope:
  note: >-
    Oracle Partitioning is a licensed Oracle Database Enterprise Edition option, not a standalone
    product with its own API. Its state is CREATED and ALTERED through SQL DDL
    (PARTITION BY RANGE/LIST/HASH/REFERENCE, ALTER TABLE ... SPLIT/MERGE/DROP/EXCHANGE PARTITION),
    and it is READ over REST through the ORDS Database API Data Dictionary endpoints modelled here.
    That read/write asymmetry is the defining fact about this entity graph.
entities:
