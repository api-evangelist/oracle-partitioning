gaps:
  - No subpartition endpoint exists, so composite partitioning is observable only as a count.
  - No endpoint reports the partitioning TYPE (RANGE/LIST/HASH/REFERENCE/INTERVAL/AUTO) or the partition key column; that lives in DBA_PART_TABLES, which the contract does not project.
  - There is no write path. A partition cannot be created, split, merged, exchanged, moved or dropped through this API.
