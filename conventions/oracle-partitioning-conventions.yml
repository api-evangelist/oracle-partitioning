idempotency:
  supported: false
  header: null
  scope: null
  retention: null
  evidence: >-
    No Idempotency-Key, Idempotency-Token or equivalent parameter or header appears in any of the
    352 operations, and the ORDS documentation defines no replay-safe retry mechanism. Of the
    116 write operations (54 POST, 24 PUT, 35 DELETE, 3 PATCH), the PUTs and DELETEs are naturally
    idempotent by HTTP semantics; the POSTs are not, and a retried POST after a timeout can create
    a second object.
  agent_guidance: >-
    Treat every POST on this API as at-most-once. Before retrying a POST that timed out, re-read the
    collection to check whether the object was created. ETag is returned on exactly one operation,
    so optimistic concurrency is not a general option here either.
dry_run_mode:
  supported: false
  evidence: No dry-run, validate-only, preview or simulate parameter appears in the contract.
reversibility:
  grade: documented
  rationale: >-
    Reversal paths exist for several write surfaces and are named in the contract, but Oracle
    publishes no time-bounded window for any of them, so this cannot be graded verified. Where the
    docs state a window is absent, that absence is recorded rather than a window being invented.
  write_surface_present: true
  surfaces:
    - surface: Partitioning itself (the option this repo profiles)
      reversal: 'none over REST'
      window: null
      note: >-
        The ORDS Database API exposes partitions READ-ONLY (two GET operations). There is no
        create/split/merge/exchange/drop over REST, therefore no reversal over REST either.
        Partition maintenance is SQL DDL, which is implicitly committed and NOT transactionally
        reversible — ALTER TABLE ... DROP PARTITION cannot be rolled back. Oracle's own published
        partitioning skill documents the safe alternatives (EXCHANGE PARTITION with a staging table,
        which is reversible by exchanging back; and Flashback, bounded by the database UNDO
        retention the operator configures).
      docs: https://github.com/oracle/skills/blob/main/db/design/partitioning-strategy.md
    - surface: Pluggable Database Lifecycle Management
      reversal: 'DELETE /database/pdbs/{pdb_name} reverses a create; open/close state changes are reversible via the status endpoints'
      operationId: null
      window: null
      note: 'Contract declares no operationIds on these paths, so only path+method can be cited.'
    - surface: Pluggable Database Snapshot Carousel
      reversal: 'Restore from a PDB snapshot'
      window: null
      note: >-
        The retention of the snapshot carousel is a database configuration value set by the
        operator (MAX_PDB_SNAPSHOTS), not a value Oracle publishes as an API window.
    - surface: Data Guard
      reversal: 'Switchover / failover reversal via the Data Guard configuration endpoints'
      window: null
    - surface: Vector tables (VecDB)
      reversal: 'DELETE on the created vector table / model reverses the corresponding POST'
      window: null
      note: 'Hard delete, no restore window is published.'
  na: false
  agent_guidance: >-
    No published reversal window exists anywhere on this surface. An agent must not assume a
    grace period on any destructive operation, and must not treat a partition DDL operation
    issued outside this API as undoable.
