    so tracing exists at the deployment level rather than as a per-response correlation header.
  source: https://www.oracle.com/tools/ords/ords-relnotes-26.1.0.html
versioning:
  scheme: 'Path-segment "stable" plus a calendar-dated contract version'
  contract_version: '2026.03.26'
  path_pattern: 'https://<server>/<context-root>/<database>/<schema>/_/db-api/stable/<service-path>'
  source: 'info.description of the published contract'
  note: >-
    The API document is versioned by ORDS RELEASE (26.1, 25.4, ...), not by a version in the URL.
    The URL carries the literal segment "stable". A caller therefore cannot pin a contract version
    from the request; the contract in force is whatever the operator's ORDS build ships.
