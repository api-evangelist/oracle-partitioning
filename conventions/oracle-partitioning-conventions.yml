rate_limit_signaling:
  headers_declared: []
  note: >-
    The contract declares no rate-limit response headers and Oracle publishes no request quota for
    the ORDS Database API. ORDS is customer-deployed, so throughput is bounded by the operator's
    connection pool sizing rather than by a vendor limit.
  see: rate-limits/oracle-partitioning-rate-limits.yml
