description: >-
  Cross-cutting runtime semantics for the Oracle REST Data Services (ORDS) Database API, the
  machine-readable surface through which Oracle Partitioning metadata is read. Derived from the
  published contract (Oracle REST Data Services API 2026.03.26, OpenAPI 3.0.0, 261 paths /
  352 operations) and the ORDS documentation.
authentication:
  styles:
    - { scheme: BasicAuth, type: http, note: 'HTTP Basic against a database or ORDS-managed user' }
    - { scheme: BearerAuth, type: http, note: 'Bearer JWT' }
    - { scheme: OAuth2, type: oauth2, flows: [implicit, authorizationCode, clientCredentials], authorizationUrl: /oauth/auth, tokenUrl: /oauth/token }
  note: >-
    The OAuth2 endpoints are declared as RELATIVE paths (/oauth/auth, /oauth/token) because ORDS is
    customer-deployed; they resolve against the operator's own ORDS host. The contract declares no
    top-level security[] requirement and enumerates no scopes.
  authorization_model: >-
    Effective authorization is Oracle Database role based, not scope based. Individual operations
    state their requirement in prose — e.g. "A client requires SQL Administrator or SQL Developer
    role to invoke this service" on the partitions endpoints. That requirement is in the description
    text, not in a machine-readable security block, so an agent cannot pre-check it.
  see: authentication/oracle-partitioning-authentication.yml
pagination:
  style: limit-offset with a hasMore flag
  request_params:
    - { name: limit, in: query, type: integer, description: The maximum number of records to return }
    - { name: q, in: query, type: object, description: 'ORDS filter object — filtering and ordering across pages' }
  response_fields:
    - { name: items, type: array, description: The page of records }
    - { name: hasMore, type: boolean, description: Indicates if there are more records to be retrieved }
    - { name: limit, type: integer, description: The actual page size limit applied by the server }
    - { name: offset, type: integer, description: The actual index from which the item resources are returned }
    - { name: count, type: integer, description: Total number of records in the current response }
    - { name: links, type: array, description: 'LinkRelation objects {rel, href} for next/prev/self traversal' }
  coverage: 'limit is declared on 63 operations; q on 59'
  note: >-
    offset is returned in the response envelope but is not declared as a request parameter in the
    contract. Page traversal is expected to follow links[] rel=next rather than to construct an
    offset, which is the correct agent behaviour here.
