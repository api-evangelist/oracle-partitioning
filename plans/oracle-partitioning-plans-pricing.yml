specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Oracle Partitioning
providerId: oracle-partitioning
generated: '2026-08-27'
method: searched
source: https://www.oracle.com/a/ocom/docs/corporate/pricing/technology-price-list-070617.pdf
created: '2026-05-04'
modified: '2026-08-27'
# 2026-08-27: this file previously held a bulk-sweep SCAFFOLD (invented Free/Professional/Enterprise
# tiers with placeholder quotas against fake hosts). That scaffold is gone. Everything below is read
# verbatim from Oracle's own published Technology Global Price List, effective August 3, 2026.
description: >-
  Published pricing for the Oracle Partitioning option. Partitioning is not sold as an API plan with
  request quotas; it is a perpetual-licence Oracle Database Enterprise Edition option, priced per
  Named User Plus or per Processor, with annual Software Update Licence & Support charged on top.
  There is no free tier, no usage-based tier and no request quota of any kind.
pricing_model: perpetual-licence
price_list:
  name: Oracle Technology Global Price List
  effective: '2026-08-03'
  currency: USD
  region: 'Prices in USA (Dollar)'
  url: https://www.oracle.com/a/ocom/docs/corporate/pricing/technology-price-list-070617.pdf
  section: 'Database Products > Oracle Database > Enterprise Edition Options'
  probed: { status: 200, note: '647KB PDF, 15 pages; 200 with a browser User-Agent' }
prerequisite:
  name: Oracle Database Enterprise Edition
  reason: 'Partitioning is an Enterprise Edition option and cannot be licensed on Standard Edition 2.'
  named_user_plus_licence: '950.00'
  named_user_plus_support: '209.00'
  processor_licence: '47500.00'
  processor_support: '10450.00'
plan_count: 2
plans:
  - id: oracle-partitioning-named-user-plus
    name: 'Partitioning — Named User Plus'
    type: paid
    metric: 'Named User Plus'
    description: >-
      Per-named-user licence metric for the Partitioning option, on top of an Oracle Database
      Enterprise Edition Named User Plus licence. Oracle applies minimum-user rules per processor
      to this metric; those minimums are stated in the price list's licensing rules, not here.
    entries:
      - { label: Licence, name: licence, type: one-time, metric: named-user-plus, price: '230.00', currency: USD, unit: 1 }
      - { label: Software Update Licence & Support, name: support, type: recurring, metric: named-user-plus, price: '50.60', currency: USD, timeFrame: year, unit: 1 }
  - id: oracle-partitioning-processor
    name: 'Partitioning — Processor'
    type: paid
    metric: Processor
    description: >-
      Per-processor licence metric for the Partitioning option, on top of an Oracle Database
      Enterprise Edition Processor licence. Processor counts are computed with Oracle's core factor
      table, which is published in the same price list.
    entries:
      - { label: Licence, name: licence, type: one-time, metric: processor, price: '11500.00', currency: USD, unit: 1 }
      - { label: Software Update Licence & Support, name: support, type: recurring, metric: processor, price: '2530.00', currency: USD, timeFrame: year, unit: 1 }
free_tier:
  present: false
  note: >-
    There is no free tier for the Partitioning option itself. Free DEVELOPMENT environments exist
    (Oracle AI Database Free container images, Always Free Autonomous AI Database, freesql.com) —
    see sandbox/oracle-partitioning-sandbox.yml — but they are development environments, not a plan.
cloud_note: >-
  In Oracle Cloud, partitioning is included in Autonomous Database and in the Enterprise Edition
  variants of Database Cloud Service rather than licensed separately, so the prices above apply to
  on-premises and BYOL licensing. Oracle publishes OCI database service pricing separately.
maintainers:
