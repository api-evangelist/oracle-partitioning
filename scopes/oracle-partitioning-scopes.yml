finding: Oracle publishes NO OAuth scope reference for this API and the contract enumerates zero scopes across all three
  declared flows. This is not a harvesting gap — it is the provider's model. Authorization on the REST surface is Oracle
  Database ROLE based (SQL Administrator / SQL Developer), stated in operation prose rather than as scopes.
scopes_elsewhere:
  surface: ORDS MCP endpoint
  note: The one place ORDS does use OAuth scopes is the MCP endpoint, where a per-pool mcp.scope setting names the scope
    required to reach that database connection pool. The scope VALUES are chosen by the operator, not published by Oracle,
    so there is no fixed scope list to record. When mcp.security.jwt.profile.role.claim.name is configured, ORDS switches
    from scope mode to role mode entirely.
