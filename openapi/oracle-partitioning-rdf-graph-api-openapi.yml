              examples:
                construct:
                  value: '<http://www.example.oracle.com/john> <http://www.example.oracle.com/dept> <http://www.example.oracle.com/sales> .

                    <http://www.example.oracle.com/john> <http://www.example.oracle.com/fname> "John"@en .

                    '
