          description: Size of the useful portion of the file (in Oracle blocks).
        online_status:
          type: string
          description: Online status of the file.
        total_space:
          type: integer
          description: Total size of the files (in bytes).
        used_space:
          type: integer
          description: Total used space (in bytes).
        free_space:
