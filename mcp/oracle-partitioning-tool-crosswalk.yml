description: >-
  Binding between Oracle's published MCP tools and the operations of the Oracle REST Data Services
  Database API. The two surfaces are projections of the same database from the same vendor, but they
  are NOT parallel: the MCP surface is a small generic SQL-execution surface, and the REST surface is
  352 typed operations. Almost nothing binds one-to-one, and that divergence is the finding.
