    file: openapi/oracle-partitioning-ords-database-api-openapi.json
    title: Oracle REST Data Services API
    version: '2026.03.26'
    paths: 261
    operations: 352
    gated: false
    note: The contract itself is public on docs.oracle.com; calling it requires a customer ORDS deployment.
  mcp:
    url: 'https://<ords-host>/mcp'
    gated: true
    note: >-
      Templated customer host, disabled by default, OAuth 2.0 Bearer JWT. No live tools/list was
      retrievable, so tool input schemas are unknown and every binding below is by documented
      semantics, not by schema comparison.
  graphql:
    present: false
crosswalk:
  - tool: database_list
    category: discovery
    rest: []
    binding: none
    confidence: high
    note: >-
      Lists MCP-enabled ORDS connection pools. The REST surface has no equivalent — pools are an
      ORDS configuration concept exposed only to MCP. The closest REST analogue, /database/pdbs/,
      lists pluggable databases, which is a different thing.
  - tool: sql_run
    category: execution
    rest: []
    binding: none
    confidence: high
    note: >-
      VERIFIED ABSENT: the published contract declares no generic SQL-execution operation. Every one
      of its 352 operations is typed, and the only statement-executing POSTs are the two RDF SPARQL
      endpoints. ORDS does ship a REST Enabled SQL Service, but it lives on a different ORDS path
      (/ords/{schema}/_/sql) and is not described by this document. This is the tool through which
      ALL partition DDL reaches an agent — CREATE TABLE ... PARTITION BY, ALTER TABLE ...
      SPLIT/MERGE/EXCHANGE/DROP PARTITION — and none of it has a typed REST operation to bind to.
  - tool: schema metadata inspection
    category: metadata
    rest:
      - 'GET /database/objects/'
      - 'GET /database/objects/tables/'
      - 'GET /database/objects/columns/'
      - 'GET /database/objects/indexes/'
      - 'GET /database/objects/partitions/'
      - 'GET /database/objects/partitions/{table_owner},{table_name},{partition_name}'
      - 'GET /database/tablespaces/'
    binding: semantic
    confidence: medium
    note: >-
      One MCP tool subsumes the whole Data Dictionary tag of the REST API (29 operations). This is
      the partitioning-relevant row: the two partitions endpoints are the only typed partition
      surface in either projection, and MCP reaches them as generic metadata rather than as a
      partition-shaped tool.
  - tool: list-connections
    category: discovery
    rest: []
    binding: none
    confidence: high
    note: SQLcl-local concept (saved named connections on the developer's machine). No REST analogue.
  - tool: connect
    category: session
    rest: []
    binding: none
    confidence: high
    note: SQLcl-local. REST is stateless per request against a configured pool.
  - tool: run-sql
    category: execution
    rest: []
    binding: none
    confidence: high
    note: SQLcl equivalent of sql_run; same absence of a backing REST operation.
  - tool: run-sqlcl
    category: execution
    rest: []
    binding: none
    confidence: high
    note: >-
      Runs native SQLcl commands (LIQUIBASE, DDL, DATAPUMP, FORMAT, ...). Several of these overlap
      REST tags by outcome (Data Pump, DDL generation) but none is a call to this API.
