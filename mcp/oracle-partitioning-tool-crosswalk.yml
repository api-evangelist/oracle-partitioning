  interpretation: >-
    Only the Data Dictionary tag (29 of 352 operations, 8%) is reachable through a named MCP tool.
    Everything else is reachable only as free-text SQL through sql_run — which is more powerful and
    far less safe — and sql_run has no counterpart in the REST contract at all, so the two surfaces
    do not converge. For an agent working on partitioning specifically, the read path is typed and
    bounded (two GET operations) while the write path is unbounded SQL DDL with no reversal window.
